[project]
name = "agentgateway-locally"
version = "0.1.0"
description = "Run agentgateway locally in a container, with provider keys from pass."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agw = "agw.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agw"
