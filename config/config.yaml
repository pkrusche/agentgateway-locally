# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  adminAddr: off
  logging:
    database:
      url: sqlite:///data/request-logs.db
  modelCatalog:
  - file: /config/base-costs.json
llm:
  policies:
    apiKey:
      mode: strict
      keys:
      - keyHash: $GATEWAY_API_KEY_SHA256
    cors:
      allowOrigins:
      - http://localhost:15000
      allowMethods:
      - GET
      - POST
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - anthropic-version
      - '*'
      maxAge: 10m
  providers:
  - name: openai
    provider: openAI
    params:
      apiKey: $OPENAI_API_KEY
  - name: anthropic
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
  models:
  - name: gpt-5-mini
    provider:
      reference: openai
    params:
      model: gpt-5-mini
  - name: gpt-5.6-sol
    provider:
      reference: openai
    params:
      model: gpt-5.6-sol
  - name: gpt-5.6-terra
    provider:
      reference: openai
    params:
      model: gpt-5.6-terra
  - name: gpt-5.6-luna
    provider:
      reference: openai
    params:
      model: gpt-5.6-luna
  - name: gpt-6-astra
    provider:
      reference: openai
    params:
      model: gpt-6-astra
  - name: claude-opus-5
    provider:
      reference: anthropic
    params:
      model: claude-opus-5
  - name: claude-sonnet-5
    provider:
      reference: anthropic
    params:
      model: claude-sonnet-5
  - name: claude-haiku-4-5
    provider:
      reference: anthropic
    params:
      model: claude-haiku-4-5
  - name: claude-fable-5
    provider:
      reference: anthropic
    params:
      model: claude-fable-5
  - name: claude-fable-5-1
    provider:
      reference: anthropic
    params:
      model: claude-fable-5-1
mcp:
  port: 3000
  targets: []
  policies:
    apiKey:
      mode: strict
      keys:
      - keyHash: $GATEWAY_API_KEY_SHA256
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - authorization
      - content-type
      - mcp-session-id
      - mcp-protocol-version
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
gateways:
  ui:
    port: 15000
ui:
  gateways:
  - ui
  policies:
    basicAuth:
      mode: strict
      htpasswd:
        file: /config/htpasswd
      realm: agentgateway
